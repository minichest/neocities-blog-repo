name: Deploy Posts to Ice Cap Zone

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Compiles markdown text into clean HTML inside your local "public" folder
    - name: Build Blog Posts
      run: |
        npm install
        npm run build

    # Push ONLY the compiled HTML files into the specific /ice-cap-zone folder on Neocities
    - name: Deploy to Neocities using jonchang action
      uses: jonchang/deploy-neocities@master
      with:
        # Crucial: This action uses 'key' instead of api_token
        key: ${{ secrets.NEOCITIES_API_TOKEN }}
        # Crucial: This action uses 'dir' to find your build folder
        dir: public
        # Prevents the script from deleting files already sitting inside Neocities
        clean: false