name: Deploy Posts to Ice Cap Zone

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Compiles markdown text into clean HTML inside your local "public" folder
    - name: Build Blog Posts
      run: |
        npm install
        npm run build

    # Push ONLY the compiled HTML files into the specific /ice-cap-zone folder on Neocities
    - name: Deploy directly to target subfolder using jonchang
      uses: jonchang/neocities-action@v2
      with:
        api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
        # The local directory containing your compiled HTML files
        src: public
        # The specific directory on your Neocities site to push files into
        dest: ice-cap-zone